include "application.conf"

play.filters.hosts.allowed = [ ".up.railway.app" ]

db.default.driver = org.postgresql.Driver

db.default.url = ${?DATABASE_URL}
db.default.username = ${?PGUSER}
db.default.password = ${?PGPASSWORD}

play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.cors.allowedOrigins = [ ${?CORS_ALLOWED_ORIGIN} ]
play.filters.cors.allowedHttpHeaders = [ "Accept", "Content-Type", "Authorization" ]
play.filters.cors.allowedMethods = [ "GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS" ]
