@(title: String)(content: Html)(implicit request: play.api.mvc.RequestHeader, messages: play.api.i18n.Messages)

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>@title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  </head>

  <body>
    @content
  </body>
</html>
