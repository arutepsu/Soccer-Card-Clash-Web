
@()
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soccer Card Clash – Full Game Rules</title>
  <link rel="stylesheet" href='@routes.Assets.versioned("stylesheets/scenes/fullgamerules.css")'>
</head>
<body class="scene--fullgamerules">
  <section id="gamerules">
    <!-- Vue FullGameRules component will be mounted here -->
  </section>
  <script type="module">
    import { initFullGameRulesApp } from '@routes.Assets.versioned("javascripts/vue/FullGameRulesApp.js")';
    document.addEventListener('DOMContentLoaded', () => {
      initFullGameRulesApp('#gamerules');
    });
  </script>
</body>
</html>
