version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: scc-postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: soccercardclash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - scc_postgres_data:/var/lib/postgresql/data

volumes:
  scc_postgres_data:
